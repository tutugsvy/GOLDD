<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SushiFrogs — Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071c10;
      color: #d8f36a;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .soon {
      font-size: clamp(70px, 15vw, 180px);
      font-weight: 900;
      letter-spacing: -6px;
      text-transform: uppercase;
      text-shadow:
        5px 5px 0 #132f1c,
        10px 10px 0 rgba(0, 0, 0, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.03);
        opacity: 0.8;
      }
    }
  </style>
</head>

<body>

  <div class="soon">SOON</div>

</body>
</html>
